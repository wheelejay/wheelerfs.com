# Builds the site and publishes it to the gh-pages branch (which GitHub Pages
# serves at wheelerfs.com) whenever frontend/ changes on main. It can also be
# run by hand from the Actions tab.
name: Deploy website

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'tools/certificate-generator/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          publish_branch: gh-pages
